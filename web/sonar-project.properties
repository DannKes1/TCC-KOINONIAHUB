# SonarCloud do front (job "web" de .github/workflows/sonarcloud.yml, projectBaseDir = web).
# O token nao fica aqui: vem do segredo SONAR_TOKEN do repositorio, via variavel de ambiente.
sonar.projectKey=dannkes1_tcc-koinoniahub_web
sonar.organization=dannkes1
sonar.sourceEncoding=UTF-8

# Codigo e testes ficam juntos em src/ (specs ao lado do codigo, Plano 7.2): os specs entram
# como teste e ficam fora do codigo-fonte (um arquivo nao pode estar nos dois conjuntos).
# Os demais padroes ficam fora de src e valem so como protecao explicita; o E2E (web/e2e,
# Playwright) fica fora da analise.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,**/node_modules/**,dist/**,e2e/.auth/**,test-results/**

sonar.typescript.tsconfigPaths=tsconfig.app.json

# Gerado por: npm run test:cov -- --coverage.reporter=lcov
sonar.javascript.lcov.reportPaths=coverage/lcov.info
